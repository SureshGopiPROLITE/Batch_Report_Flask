{% extends 'base.html' %}

{% block content %}
<div class="inv-navbar">
  <div class="inv-navbar-left">
    <span class="inv-app-title">Silo Stock</span>
  </div>

  <div class="inv-navbar-right">
    <button class="add-btn" id="addRowBtn" {% if not user_logged_in or role == 'operator' %} disabled title="Access Denied" {% endif %}>Add</button>
    <button class="add-btn" id="exportBtn" {% if not user_logged_in or role == 'operator' %} disabled title="Access Denied" {% endif %}>Export</button>
    <input class="search-input" type="text" id="searchBox" placeholder="Search...">
  </div>
</div>

<!-- TABLE -->
<div class="stocks-table-wrapper">
  <table class="stocks-table">
    <thead>
      <tr>
        <th class="sortable" data-col="0">Silo No</th>
        <th class="sortable" data-col="1">Raw Material Name</th>
        <th class="sortable" data-col="2">Raw Material Code</th>
        <th class="sortable" data-col="3">Total Consumption (Kg)</th>
        <th class="sortable" data-col="4">Updated Time</th>
        <th class="sortable" data-col="5">Updated By</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="stocksTableBody">
      <tr><td colspan="7" class="table-error">Loading data...</td></tr>
    </tbody>
  </table>
</div>

<!-- Material suggestions (from the Total Stock list) -->
<div id="matSuggest" class="mat-suggest" hidden></div>

<style>
  .mat-suggest {
    position: fixed;
    z-index: 2000;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #b5b5b5;
    border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
    font-size: 0.9rem;
  }
  .mat-suggest-item {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 7px 10px;
    cursor: pointer;
  }
  .mat-suggest-item .code { color: #666; }
  .mat-suggest-item.active,
  .mat-suggest-item:hover { background: #e8f0ff; }
  .mat-suggest-empty { padding: 7px 10px; color: #888; }
  .mat-suggest mark { background: #fff3a0; padding: 0; }
  .reset-btn i { color: #b26a00 !important; }
</style>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const tableBody = document.getElementById("stocksTableBody");
  const addRowBtn = document.getElementById("addRowBtn");
  const exportBtn = document.getElementById("exportBtn");
  const searchBox = document.getElementById("searchBox");
  const canEdit = {{ 'true' if user_logged_in and role != 'operator' else 'false' }};
  const denied = canEdit ? "" : 'disabled title="Access Denied"';

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* =========================================================
       SORTING LOGIC
  ========================================================= */
  let sortState = {};

  // "dd-mm-yyyy hh:mm:ss" -> sortable "yyyymmddhhmmss"
  const timeKey = (t) => t.replace(/^(\d{2})-(\d{2})-(\d{4})/, "$3$2$1");

  function sortTable(colIndex, kind) {
    let rows = Array.from(tableBody.querySelectorAll("tr"));

    // Toggle sorting direction
    sortState[colIndex] = sortState[colIndex] === "asc" ? "desc" : "asc";

    rows.sort((a, b) => {
      let aVal = a.children[colIndex].innerText.trim();
      let bVal = b.children[colIndex].innerText.trim();

      if (kind === "number") {
        aVal = parseFloat(aVal) || 0;
        bVal = parseFloat(bVal) || 0;
      } else if (kind === "time") {
        aVal = timeKey(aVal);
        bVal = timeKey(bVal);
      }

      if (sortState[colIndex] === "asc") return aVal > bVal ? 1 : -1;
      return aVal < bVal ? 1 : -1;
    });

    tableBody.innerHTML = "";
    rows.forEach(r => tableBody.appendChild(r));
  }

  document.querySelectorAll("th.sortable").forEach((th) => {
    const index = Number(th.dataset.col);
    const kinds = { 0: "number", 3: "number", 4: "time" };
    th.addEventListener("click", () => sortTable(index, kinds[index]));
  });

  /* =========================================================
       MATERIAL SUGGESTIONS
       Typing in Material Name or Code lists every material from the
       Total Stock page whose name or code contains the text.
  ========================================================= */
  const suggestBox = document.getElementById("matSuggest");
  // Live on <body>: inside the page content it was clipped by the scrolling area
  document.body.appendChild(suggestBox);
  let materials = [];
  let suggestFor = null;      // { nameInput, codeInput, anchor }
  let activeIndex = -1;

  async function loadMaterials() {
    try {
      const res = await fetch("/api/materials");
      const data = await res.json();
      materials = data.success ? data.records : [];
    } catch (e) {
      materials = [];
    }
  }

  function highlight(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const i = text.toLowerCase().indexOf(q);
    if (i < 0) return safe;
    return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" +
           esc(text.slice(i + q.length));
  }

  function showSuggestions(target) {
    const q = target.anchor.value.trim().toLowerCase();
    const hits = materials.filter(m =>
      !q || m.MaterialName.toLowerCase().includes(q) || m.MaterialCode.toLowerCase().includes(q));

    suggestFor = target;
    activeIndex = -1;
    suggestBox.innerHTML = hits.length
      ? hits.slice(0, 100).map((m, i) => `
          <div class="mat-suggest-item" data-i="${i}">
            <span>${highlight(m.MaterialName, q)}</span>
            <span class="code">${highlight(m.MaterialCode, q)}</span>
          </div>`).join("")
      : `<div class="mat-suggest-empty">${materials.length
            ? "No material contains “" + esc(target.anchor.value.trim()) + "”"
            : "No materials yet - add them on the Total Stock page"}</div>`;
    suggestBox._hits = hits;

    // Open below the input, or above it when there is more room there
    // (rows at the bottom of the screen); never taller than the free space
    const r = target.anchor.getBoundingClientRect();
    const gap = 4, margin = 12;
    const below = window.innerHeight - r.bottom - gap - margin;
    const above = r.top - gap - margin;
    const openUp = below < 200 && above > below;
    const width = Math.max(r.width, 300);

    suggestBox.style.maxHeight = Math.max(Math.min(openUp ? above : below, 320), 80) + "px";
    suggestBox.style.minWidth = width + "px";
    suggestBox.style.left = Math.max(margin, Math.min(r.left, window.innerWidth - width - margin)) + "px";
    if (openUp) {
      suggestBox.style.top = "auto";
      suggestBox.style.bottom = (window.innerHeight - r.top + gap) + "px";
    } else {
      suggestBox.style.bottom = "auto";
      suggestBox.style.top = (r.bottom + gap) + "px";
    }
    suggestBox.hidden = false;
  }

  function hideSuggestions() {
    suggestBox.hidden = true;
    suggestFor = null;
  }

  function pickSuggestion(i) {
    const m = (suggestBox._hits || [])[i];
    if (!m || !suggestFor) return;
    suggestFor.nameInput.value = m.MaterialName;
    suggestFor.codeInput.value = m.MaterialCode;
    hideSuggestions();
  }

  function setActive(i) {
    const items = suggestBox.querySelectorAll(".mat-suggest-item");
    if (!items.length) return;
    activeIndex = (i + items.length) % items.length;
    items.forEach((el, n) => el.classList.toggle("active", n === activeIndex));
    items[activeIndex].scrollIntoView({ block: "nearest" });
  }

  // mousedown (not click) so the input does not lose focus first
  suggestBox.addEventListener("mousedown", (e) => {
    const item = e.target.closest(".mat-suggest-item");
    if (item) {
      e.preventDefault();
      pickSuggestion(Number(item.dataset.i));
    }
  });

  function attachSuggest(nameInput, codeInput) {
    [nameInput, codeInput].forEach((anchor) => {
      const target = { nameInput, codeInput, anchor };
      anchor.setAttribute("autocomplete", "off");
      anchor.addEventListener("input", () => showSuggestions(target));
      anchor.addEventListener("focus", () => showSuggestions(target));
      anchor.addEventListener("blur", () => setTimeout(hideSuggestions, 150));
      anchor.addEventListener("keydown", (e) => {
        if (suggestBox.hidden) return;
        if (e.key === "ArrowDown") { e.preventDefault(); setActive(activeIndex + 1); }
        else if (e.key === "ArrowUp") { e.preventDefault(); setActive(activeIndex - 1); }
        else if (e.key === "Enter" && activeIndex >= 0) { e.preventDefault(); pickSuggestion(activeIndex); }
        else if (e.key === "Escape") hideSuggestions();
      });
    });
  }

  // Page scrolled -> the list would float away from its input; scrolling the
  // list itself is fine
  window.addEventListener("scroll", (e) => {
    if (e.target !== suggestBox) hideSuggestions();
  }, true);
  window.addEventListener("resize", hideSuggestions);

  /* =========================================================
       LOAD STOCK DATA
  ========================================================= */
  async function loadStocks() {
    const response = await fetch("/api/stocks");
    const data = await response.json();

    tableBody.innerHTML = "";

    if (!data.success || data.records.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="7" class="table-error">No records found</td></tr>`;
      return;
    }

    data.records.forEach(row => {
      const tr = document.createElement("tr");
      tr.dataset.silono = row.SiloNo;
      tr.dataset.material = row.MaterialName;

      tr.innerHTML = `
        <td>${esc(row.SiloNo)}</td>
        <td>${esc(row.MaterialName)}</td>
        <td>${esc(row.MaterialCode)}</td>
        <td>${esc(row.TotalExtracted)}</td>
        <td>${esc(row.UpdatedAt)}</td>
        <td>${esc(row.OperatorName)}</td>

        <td class="action-cell">
          <button class="table-action-btn edit-btn" title="Edit" ${denied}><i class='bx bx-edit'></i></button>
          <button class="table-action-btn reset-btn" title="Reset Total Consumption to 0" ${denied}><i class='bx bx-reset'></i></button>
          <button class="table-action-btn delete-btn" title="Delete" ${denied}><i class='bx bx-trash'></i></button>
        </td>
      `;

      tableBody.appendChild(tr);
    });
  }

  /* =========================================================
       ADD NEW ROW
  ========================================================= */
  addRowBtn.addEventListener("click", () => {

    if (document.querySelector(".new-row")) return;

    const tr = document.createElement("tr");
    tr.classList.add("new-row");

    tr.innerHTML = `
      <td><input type="text" class="edit-input in-silo" placeholder="Silo No"></td>
      <td><input type="text" class="edit-input in-name" placeholder="Type to search materials"></td>
      <td><input type="text" class="edit-input in-code" placeholder="Material Code"></td>
      <td><input type="text" class="edit-input" value="0" disabled></td>
      <td><input type="text" class="edit-input" value="" disabled></td>
      <td><input type="text" class="edit-input" value="{{ user or '' }}" disabled></td>

      <td>
        <button class="table-action-btn save-new-btn"><i class='bx bx-check'></i></button>
        <button class="table-action-btn cancel-new-btn"><i class='bx bx-x'></i></button>
      </td>
    `;

    tableBody.prepend(tr);
    attachSuggest(tr.querySelector(".in-name"), tr.querySelector(".in-code"));
    tr.querySelector(".in-silo").focus();

    tr.querySelector(".cancel-new-btn").onclick = () => tr.remove();

    tr.querySelector(".save-new-btn").onclick = async () => {

      const newData = {
        SiloNo: tr.querySelector(".in-silo").value.trim(),
        MaterialName: tr.querySelector(".in-name").value.trim(),
        MaterialCode: tr.querySelector(".in-code").value.trim()
      };

      if (!newData.SiloNo || !newData.MaterialName) {
        alert("Fill required fields!");
        return;
      }

      const res = await fetch("/api/stocks/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(newData)
      });

      const result = await res.json();
      if (result.success) loadStocks();
      else alert(result.error);
    };
  });

  /* =========================================================
       EDIT / RESET / DELETE
  ========================================================= */
  tableBody.addEventListener("click", async (e) => {

    // EDIT
    const editBtn = e.target.closest(".edit-btn");
    if (editBtn) {

      const row = editBtn.closest("tr");
      if (row.classList.contains("editing")) return;

      row.classList.add("editing");

      const cols = row.querySelectorAll("td");
      const siloNo = row.dataset.silono;
      const classes = ["in-silo", "in-name", "in-code"];

      // Silo No, Material Name, Material Code are editable
      for (let i = 0; i < 3; i++) {
        const val = cols[i].innerText.trim();
        cols[i].innerHTML = `<input class="edit-input ${classes[i]}" value="${esc(val)}">`;
      }
      const nameInput = row.querySelector(".in-name");
      const codeInput = row.querySelector(".in-code");
      attachSuggest(nameInput, codeInput);

      cols[6].innerHTML = `
        <button class="table-action-btn save-btn"><i class='bx bx-check'></i></button>
        <button class="table-action-btn cancel-btn"><i class='bx bx-x'></i></button>
      `;

      cols[6].querySelector(".cancel-btn").onclick = () => loadStocks();

      cols[6].querySelector(".save-btn").onclick = async () => {
        const updated = {
          SiloNo: row.querySelector(".in-silo").value.trim(),
          MaterialName: nameInput.value.trim(),
          MaterialCode: codeInput.value.trim()
        };

        // New material in the silo -> Total Consumption starts again from 0
        const oldName = nameInput.defaultValue.trim(), oldCode = codeInput.defaultValue.trim();
        if ((updated.MaterialName !== oldName || updated.MaterialCode !== oldCode) &&
            !confirm(`Material changed for Silo ${siloNo}:\n` +
                     `${oldName || "-"} (${oldCode || "-"})  ->  ${updated.MaterialName || "-"} (${updated.MaterialCode || "-"})\n\n` +
                     `Total Consumption (Kg) will be reset to 0. Continue?`)) {
          return;
        }

        const res = await fetch(`/api/stocks/update/${encodeURIComponent(siloNo)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updated)
        });

        const result = await res.json();
        if (result.success) loadStocks();
        else alert(result.error);
      };
      return;
    }

    // RESET WEIGHT
    const resetBtn = e.target.closest(".reset-btn");
    if (resetBtn) {
      const row = resetBtn.closest("tr");
      const siloNo = row.dataset.silono;
      const consumed = row.children[3].innerText.trim() || "0";

      if (!confirm(`Reset Total Consumption of Silo ${siloNo} (${row.dataset.material || "-"}) ` +
                   `from ${consumed} Kg to 0?`)) return;

      const res = await fetch(`/api/stocks/reset/${encodeURIComponent(siloNo)}`, { method: "POST" });
      const result = await res.json();
      if (result.success) loadStocks();
      else alert(result.error);
      return;
    }

    // DELETE
    const deleteBtn = e.target.closest(".delete-btn");
    if (deleteBtn) {
      const row = deleteBtn.closest("tr");
      const siloNo = row.dataset.silono;

      if (!confirm(`Delete Silo ${siloNo}?`)) return;

      const res = await fetch(`/api/stocks/delete/${encodeURIComponent(siloNo)}`, { method: "DELETE" });

      const result = await res.json();
      if (result.success) row.remove();
      else alert(result.error);
    }

  });

  /* =========================================================
       SEARCH FILTER
  ========================================================= */
  searchBox.addEventListener("input", () => {
    const filter = searchBox.value.toLowerCase();
    Array.from(tableBody.querySelectorAll("tr")).forEach(row => {
      row.style.display = row.innerText.toLowerCase().includes(filter) ? "" : "none";
    });
  });

  /* =========================================================
       EXPORT EXCEL
  ========================================================= */
  exportBtn.addEventListener("click", async () => {
    const res = await fetch("/api/stocks/export", { method: "POST" });
    if (!res.ok) {
      alert("Export failed");
      return;
    }
    const blob = await res.blob();

    // Get current date & time
    const now = new Date();

    const currentDate = now.toISOString()
      .slice(0, 16)        // YYYY-MM-DDTHH:MM
      .replace("T", "_")   // YYYY-MM-DD_HH:MM
      .replace(/:/g, "-"); // safe filename

    const filename = `SKEW_SiloStock_${currentDate}.xlsx`;

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();

    URL.revokeObjectURL(a.href);
  });

  loadMaterials();
  loadStocks();

});
</script>

{% endblock %}
