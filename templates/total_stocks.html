{% extends 'base.html' %}

{% block content %}
<div class="analytics-content">
  <!-- Tabs (same look as the Analytics page) -->
  <div class="tabs" role="tablist">
    <button class="tab-button cat-tab active" data-tab="materials" role="tab">Materials</button>
    <button class="tab-button cat-tab" data-tab="consumption" role="tab">Consumption Report</button>
  </div>

<!-- MATERIALS TAB -->
<div class="tab-pane" data-pane="materials">
  <div class="tab-toolbar">
    <div class="inv-navbar-right">
      <input class="search-input" type="text" id="searchBox" placeholder="Search name or code...">
      <button class="inv-button" id="addRowBtn" {% if not user_logged_in or role == 'operator' %} disabled title="Access Denied" {% endif %}>Add</button>
      <button class="inv-button" id="importBtn" {% if not user_logged_in or role == 'operator' %} disabled title="Access Denied" {% else %} title="Excel (.xlsx) with columns MaterialName, MaterialCode" {% endif %}>Import</button>
      <button class="inv-button" id="exportBtn" {% if not user_logged_in or role == 'operator' %} disabled title="Access Denied" {% endif %}>Export</button>
      <input type="file" id="importFile" accept=".xlsx" hidden>
    </div>
  </div>
<div class="stocks-table-wrapper">
  <table class="stocks-table">
    <thead>
      <tr>
        <th>S.No</th>
        <th class="sortable" data-col="1">Material Name</th>
        <th class="sortable" data-col="2">Material Code</th>
        <th class="sortable" data-col="3">Updated Time</th>
        <th class="sortable" data-col="4">Updated By</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="materialsTableBody">
      <tr><td colspan="6" class="table-error">Loading data...</td></tr>
    </tbody>
  </table>
</div>
</div>

<!-- CONSUMPTION REPORT TAB -->
<div class="tab-pane" data-pane="consumption" hidden>
  <div class="tab-toolbar">
    <div class="inv-navbar-right">
      <input class="search-input" type="search" id="consSearch" placeholder="Search material...">
      <div class="date-filter">
        <span>From:</span>
        <input type="datetime-local" id="consFrom" class="inv-input">
      </div>
      <div class="date-filter">
        <span>To:</span>
        <input type="datetime-local" id="consTo" class="inv-input">
      </div>
      <button class="inv-button" id="consViewBtn">View</button>
      <button class="inv-button" id="consExportBtn">Export</button>
      <span class="total-label" id="consSummary">Select From / To and press View.</span>
    </div>
  </div>
  <div class="stocks-table-wrapper">
    <table class="stocks-table" id="consTable">
      <thead>
        <tr>
          <th>S.No</th>
          <th class="cons-sort" data-col="1">Material Name</th>
          <th class="cons-sort num" data-col="2">Total Set Weight (Tons)</th>
          <th class="cons-sort num" data-col="3">Total Actual Weight (Tons)</th>
          <th class="cons-sort num" data-col="4">Loss (Tons)</th>
        </tr>
      </thead>
      <tbody id="consBody">
        <tr><td colspan="5" class="table-error">No data yet</td></tr>
      </tbody>
      <tfoot id="consFoot"></tfoot>
    </table>
  </div>
</div>
</div>

<style>
  .tab-pane[hidden] { display: none; }
  .tab-toolbar { display: flex; align-items: center; padding: 0.5rem 1rem; }
  .tab-toolbar .inv-navbar-right { flex-wrap: wrap; row-gap: 6px; }
  #consSummary { margin-left: 6px; }
  #consSummary b { color: #005da2; }
  #consTable th.cons-sort { cursor: pointer; }
  #consTable th.num, #consTable td.num { text-align: right; padding-right: 18px; }
  #consTable td.loss-pos { color: #b45309; }
  #consTable td.loss-neg { color: #047857; }
  #consTable tfoot td { font-weight: 700; background: #eef3f8; border-top: 2px solid #005da2; }
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const tableBody = document.getElementById("materialsTableBody");
  const addRowBtn = document.getElementById("addRowBtn");
  const importBtn = document.getElementById("importBtn");
  const importFile = document.getElementById("importFile");
  const exportBtn = document.getElementById("exportBtn");
  const searchBox = document.getElementById("searchBox");
  const denied = {{ 'false' if user_logged_in and role != 'operator' else 'true' }}
    ? 'disabled title="Access Denied"' : "";

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* =========================================================
       SORTING
  ========================================================= */
  let sortState = {};
  const timeKey = (t) => t.replace(/^(\d{2})-(\d{2})-(\d{4})/, "$3$2$1");

  document.querySelectorAll("th.sortable").forEach((th) => {
    const col = Number(th.dataset.col);
    th.addEventListener("click", () => {
      const rows = Array.from(tableBody.querySelectorAll("tr[data-id]"));
      sortState[col] = sortState[col] === "asc" ? "desc" : "asc";
      const dir = sortState[col] === "asc" ? 1 : -1;
      rows.sort((a, b) => {
        let x = a.children[col].innerText.trim().toLowerCase();
        let y = b.children[col].innerText.trim().toLowerCase();
        if (col === 3) { x = timeKey(x); y = timeKey(y); }
        return x > y ? dir : x < y ? -dir : 0;
      });
      rows.forEach((r, i) => { r.children[0].innerText = i + 1; tableBody.appendChild(r); });
    });
  });

  /* =========================================================
       LOAD
  ========================================================= */
  async function loadMaterials() {
    const res = await fetch("/api/materials");
    const data = await res.json();

    tableBody.innerHTML = "";
    if (!data.success || data.records.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="6" class="table-error">${
        data.success ? "No materials yet - use Add or Import" : esc(data.error)}</td></tr>`;
      return;
    }

    data.records.forEach((m, i) => {
      const tr = document.createElement("tr");
      tr.dataset.id = m.Id;
      tr.innerHTML = `
        <td>${i + 1}</td>
        <td>${esc(m.MaterialName)}</td>
        <td>${esc(m.MaterialCode)}</td>
        <td>${esc(m.UpdatedAt)}</td>
        <td>${esc(m.UpdatedBy)}</td>
        <td class="action-cell">
          <button class="table-action-btn edit-btn" title="Edit" ${denied}><i class='bx bx-edit'></i></button>
          <button class="table-action-btn delete-btn" title="Delete" ${denied}><i class='bx bx-trash'></i></button>
        </td>
      `;
      tableBody.appendChild(tr);
    });
    applySearch();
  }

  async function send(url, method, body) {
    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
    return res.json();
  }

  /* =========================================================
       ADD
  ========================================================= */
  addRowBtn.addEventListener("click", () => {
    if (document.querySelector(".new-row")) return;

    const tr = document.createElement("tr");
    tr.classList.add("new-row");
    tr.innerHTML = `
      <td></td>
      <td><input type="text" class="edit-input in-name" placeholder="Material Name"></td>
      <td><input type="text" class="edit-input in-code" placeholder="Material Code"></td>
      <td><input type="text" class="edit-input" disabled></td>
      <td><input type="text" class="edit-input" value="{{ user or '' }}" disabled></td>
      <td>
        <button class="table-action-btn save-new-btn"><i class='bx bx-check'></i></button>
        <button class="table-action-btn cancel-new-btn"><i class='bx bx-x'></i></button>
      </td>
    `;
    tableBody.prepend(tr);
    tr.querySelector(".in-name").focus();

    tr.querySelector(".cancel-new-btn").onclick = () => tr.remove();
    tr.querySelector(".save-new-btn").onclick = async () => {
      const body = {
        MaterialName: tr.querySelector(".in-name").value.trim(),
        MaterialCode: tr.querySelector(".in-code").value.trim()
      };
      if (!body.MaterialName) { alert("Material Name is required"); return; }
      const result = await send("/api/materials/add", "POST", body);
      if (result.success) loadMaterials();
      else alert(result.error);
    };
  });

  /* =========================================================
       EDIT / DELETE
  ========================================================= */
  tableBody.addEventListener("click", async (e) => {
    const editBtn = e.target.closest(".edit-btn");
    if (editBtn) {
      const row = editBtn.closest("tr");
      if (row.classList.contains("editing")) return;
      row.classList.add("editing");

      const cols = row.querySelectorAll("td");
      cols[1].innerHTML = `<input class="edit-input in-name" value="${esc(cols[1].innerText.trim())}">`;
      cols[2].innerHTML = `<input class="edit-input in-code" value="${esc(cols[2].innerText.trim())}">`;
      cols[5].innerHTML = `
        <button class="table-action-btn save-btn"><i class='bx bx-check'></i></button>
        <button class="table-action-btn cancel-btn"><i class='bx bx-x'></i></button>
      `;
      cols[5].querySelector(".cancel-btn").onclick = () => loadMaterials();
      cols[5].querySelector(".save-btn").onclick = async () => {
        const body = {
          MaterialName: row.querySelector(".in-name").value.trim(),
          MaterialCode: row.querySelector(".in-code").value.trim()
        };
        if (!body.MaterialName) { alert("Material Name is required"); return; }
        const result = await send(`/api/materials/update/${row.dataset.id}`, "PUT", body);
        if (result.success) loadMaterials();
        else alert(result.error);
      };
      return;
    }

    const deleteBtn = e.target.closest(".delete-btn");
    if (deleteBtn) {
      const row = deleteBtn.closest("tr");
      const name = row.children[1].innerText.trim();
      if (!confirm(`Delete material "${name}" from the Material Catalogue list?\n\n` +
                   `Silos that already use it are not changed.`)) return;
      const result = await send(`/api/materials/delete/${row.dataset.id}`, "DELETE");
      if (result.success) loadMaterials();
      else alert(result.error);
    }
  });

  /* =========================================================
       SEARCH - name or code containing the text
  ========================================================= */
  function applySearch() {
    const q = searchBox.value.trim().toLowerCase();
    tableBody.querySelectorAll("tr[data-id]").forEach((row) => {
      const text = (row.children[1].innerText + " " + row.children[2].innerText).toLowerCase();
      row.style.display = text.includes(q) ? "" : "none";
    });
  }
  searchBox.addEventListener("input", applySearch);

  /* =========================================================
       IMPORT / EXPORT EXCEL
  ========================================================= */
  importBtn.addEventListener("click", () => importFile.click());

  importFile.addEventListener("change", async () => {
    const file = importFile.files[0];
    importFile.value = "";
    if (!file) return;

    const form = new FormData();
    form.append("file", file);
    const res = await fetch("/api/materials/import", { method: "POST", body: form });
    const result = await res.json();
    if (result.success) {
      alert(`Import done: ${result.added} added, ${result.updated} updated.`);
      loadMaterials();
    } else {
      alert("Import failed: " + result.error);
    }
  });

  exportBtn.addEventListener("click", async () => {
    const res = await fetch("/api/materials/export", { method: "POST" });
    if (!res.ok) { alert("Export failed"); return; }
    const blob = await res.blob();
    const stamp = new Date().toISOString().slice(0, 16).replace("T", "_").replace(/:/g, "-");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `SKEW_MaterialCatalogue_${stamp}.xlsx`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  loadMaterials();

  /* =========================================================
       TABS (Materials | Consumption Report) - #consumption in the
       address opens the report tab directly
  ========================================================= */
  function showTab(name) {
    document.querySelectorAll(".cat-tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
    document.querySelectorAll(".tab-pane").forEach(p => p.hidden = p.dataset.pane !== name);
    history.replaceState(null, "", name === "materials" ? location.pathname : "#" + name);
    if (name === "consumption" && !consLoaded) loadConsumption();
  }
  document.querySelectorAll(".cat-tab").forEach(t => t.addEventListener("click", () => showTab(t.dataset.tab)));

  /* =========================================================
       CONSUMPTION REPORT
       Set / actual weight per material over the batches logged between
       From and To (tons). Loss = Actual - Set.
  ========================================================= */
  const consFrom = document.getElementById("consFrom");
  const consTo = document.getElementById("consTo");
  const consSearch = document.getElementById("consSearch");
  const consBody = document.getElementById("consBody");
  const consFoot = document.getElementById("consFoot");
  const consSummary = document.getElementById("consSummary");
  let consLoaded = false;
  let consRecords = [];
  setDefaultRange(null, consFrom, consTo);          // last 24 hours (base.html)

  const fmt3 = (v) => Number(v || 0).toFixed(3);
  const COLS = ["Material Name", "Total Set Weight (Tons)", "Total Actual Weight (Tons)", "Loss (Tons)"];

  function renderConsumption() {
    const q = consSearch.value.trim().toLowerCase();
    const rows = consRecords.filter(r => r["Material Name"].toLowerCase().includes(q));
    if (!rows.length) {
      consBody.innerHTML = `<tr><td colspan="5" class="table-error">${
        consRecords.length ? "No material matches the search" : "No consumption in this range"}</td></tr>`;
      consFoot.innerHTML = "";
      return;
    }
    consBody.innerHTML = rows.map((r, i) => {
      const loss = Number(r["Loss (Tons)"]);
      return `<tr>
        <td>${i + 1}</td>
        <td>${esc(r["Material Name"])}</td>
        <td class="num">${fmt3(r["Total Set Weight (Tons)"])}</td>
        <td class="num">${fmt3(r["Total Actual Weight (Tons)"])}</td>
        <td class="num ${loss > 0 ? "loss-pos" : loss < 0 ? "loss-neg" : ""}">${fmt3(loss)}</td>
      </tr>`;
    }).join("");
    const sum = (c) => rows.reduce((t, r) => t + Number(r[c] || 0), 0);
    consFoot.innerHTML = `<tr>
      <td></td><td>Total (${rows.length} materials)</td>
      <td class="num">${fmt3(sum(COLS[1]))}</td>
      <td class="num">${fmt3(sum(COLS[2]))}</td>
      <td class="num">${fmt3(sum(COLS[3]))}</td>
    </tr>`;
  }

  async function loadConsumption() {
    if (!consFrom.value || !consTo.value) return alert("Select both From and To.");
    if (consTo.value < consFrom.value) return alert("To cannot be before From.");
    consLoaded = true;
    consSummary.textContent = "Loading...";
    try {
      const res = await fetch("/api/consumption", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ from_time: consFrom.value, to_time: consTo.value })
      });
      const data = await res.json();
      if (!data.success) {
        consRecords = [];
        renderConsumption();
        consSummary.textContent = data.error || "Could not load the report";
        return;
      }
      consRecords = data.records;
      consSummary.innerHTML = `<b>${data.batches}</b> batch(es) from <b>${esc(consFrom.value.replace("T", " "))}</b>` +
                              ` to <b>${esc(consTo.value.replace("T", " "))}</b>`;
      renderConsumption();
    } catch (e) {
      consSummary.textContent = "Server error - " + e.message;
    }
  }

  document.getElementById("consViewBtn").addEventListener("click", loadConsumption);
  consSearch.addEventListener("input", renderConsumption);

  // Sort by a column (click again = reverse); numbers numerically
  let consSort = {};
  document.querySelectorAll("#consTable th.cons-sort").forEach(th => {
    th.addEventListener("click", () => {
      const key = COLS[Number(th.dataset.col) - 1];
      const dir = consSort[key] = consSort[key] === "asc" ? "desc" : "asc";
      const sign = dir === "asc" ? 1 : -1;
      consRecords.sort((a, b) => key === COLS[0]
        ? sign * a[key].localeCompare(b[key], undefined, { sensitivity: "base" })
        : sign * (Number(a[key]) - Number(b[key])));
      renderConsumption();
    });
  });

  document.getElementById("consExportBtn").addEventListener("click", async (e) => {
    if (!consFrom.value || !consTo.value) return alert("Select both From and To.");
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
      const res = await fetch("/api/consumption/export", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ from_time: consFrom.value, to_time: consTo.value,
                               search: consSearch.value.trim() })
      });
      if (!res.ok) {
        let msg = `Export failed (${res.status})`;
        try { msg = (await res.json()).error || msg; } catch (err) {}
        return alert(msg);
      }
      const blob = await res.blob();
      const name = (res.headers.get("Content-Disposition") || "").match(/filename="?([^";]+)"?/);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name ? name[1] : "SKEW_Consumption.xlsx";
      a.click();
      URL.revokeObjectURL(a.href);
    } finally {
      btn.disabled = false;
    }
  });

  if (location.hash === "#consumption") showTab("consumption");
});
</script>

{% endblock %}
