{% extends 'base.html' %}
{% block content %}
<style>
  .batch-details { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
                   gap: 6px 16px; background: #f4f7fb; border: 1px solid #d5dbe3; border-radius: 6px;
                   padding: 10px 14px; margin: 4px 0 12px; }
  .batch-detail { display: flex; flex-direction: column; min-width: 0; }
  .batch-detail span { font-size: .72rem; color: #5f6b7a; text-transform: uppercase; letter-spacing: .03em; }
  .report-search { display: flex; align-items: center; gap: 6px; border: 1px solid #aaa; border-radius: 4px;
                   background: #fff; padding: 0 8px; height: 4vh; min-width: 220px; }
  .report-search i { color: #5f6b7a; }
  .report-search input { border: none; outline: none; flex: 1; min-width: 0; font-size: .9rem; background: transparent; }
  .report-search span { font-size: .78rem; color: #5f6b7a; white-space: nowrap; }
  .batch-detail b { font-size: .92rem; color: #1f2933; font-weight: 600; overflow-wrap: anywhere; }
</style>

<!-- =============================== REPORT HEADER =============================== -->
<div class="inv-navbar">
  <div class="inv-navbar-left">
    <span class="inv-app-title">Report</span>
  </div>

  <div class="inv-navbar-right">
    <div class="report-search">
      <i class="bx bx-search"></i>
      <input type="search" id="reportSearch" placeholder="Search batch, recipe, plant..." autocomplete="off">
      <span id="searchCount"></span>
    </div>

    <select id="hourSelect" class="inv-select">
      <option value="1 Hr">1 Hr</option>
      <option value="4 Hr">4 Hr</option>
      <option value="8 Hr">8 Hr</option>
      <option value="12 Hr">12 Hr</option>
      <option value="24 Hr">24 Hr</option>
      <option value="Custom">Custom</option>
    </select>

    <div class="date-filter">
      <span>From:</span>
      <input type="datetime-local" id="fromDate" class="inv-input">
    </div>

    <div class="date-filter">
      <span>To:</span>
      <input type="datetime-local" id="toDate" class="inv-input">
    </div>

    <button id="viewBtn" class="inv-button">View</button>
    <button id="exportBtn" class="inv-button">Export</button>

    <span id="totalLabel" class="total-label">
      Total Batch Weight (in Tons): --
    </span>
  </div>
</div>

<!-- =============================== REPORT TABLE =============================== -->
<div class="report-table-wrapper">
  <table class="inv-table" id="reportTable">
    <thead><tr><th>Waiting...</th></tr></thead>
    <tbody><tr><td>Waiting for data...</td></tr></tbody>
  </table>
</div>

<!-- =============================== POPUP =============================== -->
<div id="popupModal" class="popup-overlay" style="display:none;">
  <div class="popup-content">
    <h3 id="popupTitle">PLC Data</h3>
    <div id="popupDetails" class="batch-details"></div>

    <div class="popup-table-wrapper">
      <table class="inv-table" id="popupTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="popup-footer">
      <button id="downloadPDF" class="inv-button primary"
        {% if not user_logged_in or role == 'operator' %} disabled {% endif %}>
        Download PDF
      </button>

      <button id="downloadExcel" class="inv-button success"
        {% if not user_logged_in or role == 'operator' %} disabled {% endif %}>
        Download Excel
      </button>

      <button id="closePopup" class="inv-button warning">Close</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ================= ELEMENTS ================= */
  const hourSelect = document.getElementById("hourSelect");
  const fromDate   = document.getElementById("fromDate");
  const toDate     = document.getElementById("toDate");
  const viewBtn    = document.getElementById("viewBtn");
  const exportBtn  = document.getElementById("exportBtn");
  const totalLabel = document.getElementById("totalLabel");

  const tableHead  = document.querySelector("#reportTable thead");
  const tableBody  = document.querySelector("#reportTable tbody");

  const popup      = document.getElementById("popupModal");
  const popupTitle = document.getElementById("popupTitle");
  const popupHead  = document.querySelector("#popupTable thead");
  const popupBody  = document.querySelector("#popupTable tbody");
  const closePopup = document.getElementById("closePopup");

  /* ================= COLUMN VISIBILITY SETTING ================= */
  let showSpeedColumns = true; // default until loaded from server

  async function loadColumnSetting() {
    try {
      const res = await fetch("/api/settings/get_column_settings");
      const result = await res.json();
      showSpeedColumns = !!result.show_cspeed_fspeed;
    } catch (err) {
      console.error("Column setting fetch failed:", err);
      showSpeedColumns = true;
    }
  }

  /* ================= DATE LIMIT ================= */
  const now = new Date().toISOString().slice(0,16);
  fromDate.max = toDate.max = now;

  fromDate.onclick = toDate.onclick = () => hourSelect.value = "Custom";
  hourSelect.onchange = () => {
    if (hourSelect.value !== "Custom") {
      fromDate.value = "";
      toDate.value = "";
    }
  };

  /* ================= SORTING ================= */
  let sortState = {};

  function enableSorting(head, body) {
    head.querySelectorAll("th").forEach((th, i) => {
      th.onclick = () => sortTable(body, i);
      th.style.cursor = "pointer";
    });
  }

  function sortTable(body, col) {
    const rows = [...body.querySelectorAll("tr")];
    sortState[col] = sortState[col] === "asc" ? "desc" : "asc";

    rows.sort((a, b) => {
      let x = a.children[col].innerText.trim();
      let y = b.children[col].innerText.trim();
      return !isNaN(x) && !isNaN(y)
        ? (sortState[col] === "asc" ? x - y : y - x)
        : (sortState[col] === "asc" ? x.localeCompare(y) : y.localeCompare(x));
    });

    body.innerHTML = "";
    rows.forEach(r => body.appendChild(r));
  }

  /* ================= TABLE ================= */
  // Report columns in this order; any other columns follow at the end
  const COLUMN_ORDER = ["BatchNo", "TimeStamp", "Plant Name", "Recipe Name",
                        "Start Date Time", "End Date Time"];

  function orderColumns(keys) {
    const first = COLUMN_ORDER.filter(c => keys.includes(c));
    const weight = keys.filter(c => c.startsWith("Total Batch Weight"));
    const rest = keys.filter(c => !first.includes(c) && !weight.includes(c));
    return [...first, ...rest, ...weight];
  }

  function renderTable(data) {
    if (!data || !data.length) {
      tableHead.innerHTML = "<tr><th>No Data</th></tr>";
      tableBody.innerHTML = "<tr><td>No records found</td></tr>";
      return;
    }

    const cols = orderColumns(Object.keys(data[0]));
    tableHead.innerHTML = `<tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr>`;
    tableBody.innerHTML = data.map(r =>
      `<tr onclick="openPopup('${r.BatchNo}')">
        ${cols.map(c => `<td>${r[c]}</td>`).join("")}
      </tr>`
    ).join("");

    setTimeout(() => enableSorting(tableHead, tableBody), 10);
    applySearch();
  }

  /* ================= SEARCH ================= */
  // Filters the rows already loaded: any text in any column, case-insensitive.
  // Several words must all match (e.g. "feed 1605").
  const searchInput = document.getElementById("reportSearch");
  const searchCount = document.getElementById("searchCount");

  function applySearch() {
    const words = searchInput.value.toLowerCase().split(/\s+/).filter(Boolean);
    const rows = Array.from(tableBody.querySelectorAll("tr[onclick]"));
    let shown = 0;
    rows.forEach(tr => {
      const text = tr.textContent.toLowerCase();
      const match = words.every(w => text.includes(w));
      tr.style.display = match ? "" : "none";
      if (match) shown++;
    });
    searchCount.textContent = words.length && rows.length ? `${shown} of ${rows.length}` : "";
  }

  searchInput.addEventListener("input", applySearch);

  /* ================= RESTORE ================= */
  async function restoreSession() {
    const filters = JSON.parse(localStorage.getItem("report_filters"));
    const table   = JSON.parse(localStorage.getItem("report_table"));
    const total   = localStorage.getItem("report_total");

    if (filters && table) {
      hourSelect.value = filters.hours;
      fromDate.value = filters.from_time;
      toDate.value = filters.to_time;
      renderTable(table);
      totalLabel.textContent = `Total Batch Weight (in Tons): ${total}`;
      return;
    }

    viewBtn.click();
  }

  /* ===== STARTUP SEQUENCE ===== */
  (async () => {
    await loadColumnSetting();   // load setting BEFORE anything else runs
    await restoreSession();

    /* ===== INITIAL DEFAULT LOAD (REPORT) ===== */
    if (!localStorage.getItem("report_filters")) {
      setDefaultRange(hourSelect, fromDate, toDate);

      setTimeout(() => viewBtn.click(), 200);
    }
  })();

  /* ================= VIEW ================= */
  viewBtn.onclick = async () => {
    const payload = {
      hours: hourSelect.value,
      from_time: fromDate.value,
      to_time: toDate.value
    };

    const res = await fetch("/api/report_data", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
      
    });

    const text = await res.text();
    
    let r;
    try {
      r = JSON.parse(text);
    } catch(e) {
      console.error("JSON parse failed:", e);
      alert("Too much data! Please narrow your date range.");
      return;
    }

    if (!r.success) return;
    renderTable(r.data);
    totalLabel.textContent = `Total Batch Weight (in Tons): ${r.total_weight}`;

    localStorage.setItem("report_filters", JSON.stringify(payload));
    localStorage.setItem("report_table", JSON.stringify(r.data));
    localStorage.setItem("report_total", r.total_weight);
  };
  
  /* ================= EXPORT ================= */
  exportBtn.addEventListener("click", async () => {

    const hours = hourSelect.value;
    const from_time = fromDate.value;
    const to_time = toDate.value;

    const res = await fetch("/api/export_data", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ hours, from_time, to_time })
    });

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    // Make filename safe (replace ":" with "-")
    const safeFrom = from_time.replace(/[:T]/g, "-");
    const safeTo = to_time.replace(/[:T]/g, "-");

    const filename = `SKEW_Batchs_Report_${safeFrom}_to_${safeTo}.xlsx`;

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();

    URL.revokeObjectURL(url);
  });


  /* ================= POPUP ================= */
  window.openPopup = async (batchNo) => {
    await loadColumnSetting();   // re-check setting every time popup opens

    popup.style.display = "flex";
    popupTitle.textContent = `PLC Data for BatchNo: ${batchNo}`;

    const res = await fetch("/api/plc_data", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ batch_no: batchNo })
    });

    const r = await res.json();
    const data = r.data || [];
    renderBatchDetails(batchNo, r.daily_batch, r.details || {}, data);

    if (!data.length) {
      popupHead.innerHTML = "<tr><th>No Data</th></tr>";
      popupBody.innerHTML = "<tr><td>No PLC data found</td></tr>";
      return;
    }

    let cols = [
      { k:"Category", l:"Category" },
      { k:"MaterialName", l:"Material Name" },
      { k:"SetWeight", l:"Set Weight (Kg)" },
      { k:"ActualWeight", l:"Actual Weight (Kg)" },
      { k:"Difference", l:"Difference (Kg)" },
      { k:"Tolerance", l:"Tolerance (Kg)" },
      { k:"CoarseSpeed", l:"Coarse Speed (%)" },
      { k:"FineSpeed", l:"Fine Speed (%)" },
      { k:"StartTime", l:"Start Time" },
      { k:"EndTime", l:"End Time" },
      { k:"Duration", l:"Duration (hh:mm:ss)" }
    ];

    if (!showSpeedColumns) {
      cols = cols.filter(c => c.k !== "CoarseSpeed" && c.k !== "FineSpeed");
    }

    popupHead.innerHTML = `<tr>${cols.map(c => `<th>${c.l}</th>`).join("")}</tr>`;
    popupBody.innerHTML = data.map(r =>
      `<tr>${cols.map(c => `<td>${r[c.k] ?? ""}</td>`).join("")}</tr>`
    ).join("");

    setTimeout(() => enableSorting(popupHead, popupBody), 10);

    document.getElementById("downloadPDF").onclick = () => downloadReport("pdf", batchNo);
    document.getElementById("downloadExcel").onclick = () => downloadReport("excel", batchNo);
  };

  closePopup.onclick = () => popup.style.display = "none";

  function renderBatchDetails(batchNo, dailyBatch, d, rows) {
    const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
    const sum = key => rows.reduce((t, r) => t + (num(r[key]) || 0), 0);

    // Summary rows are logged with each batch; fall back to the silo rows
    const setTotal = num(d.TotalBatchSetWeight) ?? sum("SetWeight");
    const actTotal = num(d.TotalBatchActualWeight) ?? sum("ActualWeight");
    const accuracy = num(d.BatchAccuracy);
    const minutes  = num(d.BatchTimeMinutes);
    const fmt = (v, unit = "") => v === null || v === undefined || v === "" ? "--" : `${v}${unit}`;
    const kg = v => v === null ? "--" : `${Math.round(v * 100) / 100} kg`;

    const items = [
      ["Batch No", batchNo],
      ["Daily Batch No", fmt(dailyBatch)],
      ["Logged At", fmt(d.LoggedAt)],
      ["Plant Name", fmt(d["Plant Name"])],
      ["Recipe Name", fmt(d["Recipe Name"])],
      ["Mixer No", fmt(d["Mixer Selected"])],
      ["Start Date Time", fmt(d["Start Date Time"])],
      ["End Date Time", fmt(d["End Date Time"])],
      ["Batch Time", minutes === null ? "--" : `${minutes} min`],
      ["Silos Used", rows.length],
      ["Total Set Weight", kg(setTotal)],
      ["Total Actual Weight", kg(actTotal)],
      ["Difference", kg(actTotal - setTotal)],
      ["Batch Accuracy", accuracy === null ? "--" : `${accuracy} %`],
    ];
    const esc = v => String(v).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
    document.getElementById("popupDetails").innerHTML = items.map(([label, value]) =>
      `<div class="batch-detail"><span>${label}</span><b>${esc(value)}</b></div>`).join("");
  }

});

/* ================= DOWNLOAD ================= */
async function downloadReport(type, batchNo) {
  const endpoint = type === "pdf" ? "/api/plc_data/pdf" : "/api/plc_data/excel";
  const ext = type === "pdf" ? "pdf" : "xlsx";

  const res = await fetch(endpoint, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ batch_no: batchNo })
  });

  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `BatchReport_${batchNo}.${ext}`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>

{% endblock %}
