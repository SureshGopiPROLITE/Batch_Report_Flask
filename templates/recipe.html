{% extends 'base.html' %}
{% block content %}

<div class="inv-navbar recipe">
  <div class="inv-navbar-left recipe">
    <span class="inv-app-title">Recipe List</span>
    <div class="list-opt">
      <button class="icon-button" id="importBtn" {% if not user_logged_in or role == 'operator' %} disabled title="Access Denied" {% endif %} title="Import"><i class="bx bx-import"></i></button>
      <button class="icon-button" id="exportBtn" {% if not user_logged_in or role == 'operator' %} disabled title="Access Denied" {% endif %} title="Export"><i class="bx bx-export"></i></button>
    </div>
  </div>
   
  <div class="inv-navbar-right recipe">
    <div class="table-opt">
      <button class="add-btn" id="addRowRecipe" {% if not user_logged_in or role == 'operator' %} disabled title="Access Denied" {% endif %}>Add</button>

      <div style="display:flex;gap:0.2rem;align-items:center;">
        <span style="font-weight:600;padding-right: 3px;padding-left: 3px;">Selected Recipe:</span>
        <span id="selectedRecipeLabel"
          style="background:#fff;border:1px solid #aaa;padding:0.3rem 0.5rem;border-radius:0.2rem;">--</span>
    
        <span style="font-weight:600;padding-right: 3px;padding-left: 3px;">Mixer No:</span>
        
        <input
        type="number"
        id="mixerNo"
        value="1"
        min="1"
        step="1"
        class="mixer-input">
        <span style="font-weight:600;padding-left: 3px;">Download Recipe:</span>
       
      </div>

      <button id="recipedownload" class="icon-button"  title="Download"><i class="bx bxs-download"></i></button>
    </div>
  </div>
</div>

<div class="recipe-content">

  <!---------------- LEFT TREE PANEL ---------------->
  <div class="left">
    <div class="search-bar">
      <input type="text" id="searchRecipe" placeholder="Search…" class="search-input">
    </div>

    <div class="tree-actions">

      <i class='bx bx-file-blank add-icon 
          {% if not user_logged_in or role == 'operator' %} disabled-icon {% endif %}'
          title="{% if not user_logged_in or role == 'operator' %}Access Denied{% else %}Add Recipe{% endif %}"
          id="addRecipeIcon">
      </i>

      <i class='bx bx-trash delete-icon 
          {% if not user_logged_in or role == 'operator' %} disabled-icon {% endif %}'
          title="{% if not user_logged_in or role == 'operator' %}Access Denied{% else %}Delete Recipe{% endif %}"
          id="deleteRecipe">
      </i>

    </div>

    <div class="tree-view">
      <ul class="tree-root">
        <li class="folder-node expanded">
          <i class="bx bx-folder-open"></i>
          <span>Recipes</span>
        </li>
        <ul class="child-list" id="childRecipes" role="tree"></ul>
      </ul>
    </div>
  </div>

  <!---------------- RIGHT TABLE PANEL ---------------->
  <div class="right">
    <div id="recipeTableContainer">
      <p class="placeholder">Select a recipe from the left to view details.</p>
    </div>
  </div>

</div>

<script>
document.getElementById("nextMixer").addEventListener("click", () => {
    const mixer = document.getElementById("mixerNo");
    mixer.value = parseInt(mixer.value) + 1;
});
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const childList = document.getElementById("childRecipes");
  const selectedLabel = document.getElementById("selectedRecipeLabel");
  const selectedMixerLabel = document.getElementById("selectedMixerLabel");
  const tableContainer = document.getElementById("recipeTableContainer");
  const searchInput = document.getElementById("searchRecipe");
  const addRecipeIcon = document.getElementById("addRecipeIcon");
  const deleteRecipeBtn = document.getElementById("deleteRecipe");
  const exportBtn = document.getElementById("exportBtn");
  const importBtn = document.getElementById("importBtn");
  const recipedownload = document.getElementById("recipedownload")

/* =====================================================
   RECIPE COLUMN VISIBILITY
   Driven by Settings page
===================================================== */
let showSpeedColumns = true;
/* ---------------- LOAD COLUMN SETTING ---------------- */
async function loadColumnSetting() {

    try {
        const res = await fetch("/api/settings/get_column_settings");
        if (!res.ok) {
            throw new Error(`HTTP Error: ${res.status}`);
        }

        const result = await res.json();

        console.log("Column Settings Response:", result);

        /*
         * Get saved value from Settings page
         *
         * true  = Show CoarseSpeed / FineSpeed
         * false = Hide CoarseSpeed / FineSpeed
         */
        showSpeedColumns = Boolean(result.show_cspeed_fspeed);

        console.log(
            "Show CoarseSpeed / FineSpeed:",
            showSpeedColumns
        );

    } catch (err) {

        console.error(
            "Column setting fetch failed:",
            err
        );

        /*
         * Default behavior if API fails
         */
        showSpeedColumns = true;
    }
}


/* ---------------- CHECK COLUMN VISIBILITY ---------------- */
function shouldShowCSpeedFSpeed() {
    return showSpeedColumns;
}


/* ---------------- APPLY COLUMN VISIBILITY ---------------- */
function applyColumnVisibility(table) {

    const show = shouldShowCSpeedFSpeed();

    console.log(
        "Applying Speed Column Visibility:",
        show ? "SHOW" : "HIDE"
    );

    /*
     * Hide or show both:
     * CoarseSpeed
     * FineSpeed
     */
    table
        .querySelectorAll(".col-cspeed, .col-fspeed")
        .forEach(el => {

            el.style.display = show
                ? ""
                : "none";

        });
}


/* ---------------- LOAD RECIPES ---------------- */
async function loadRecipes() {

    try {

        const res =
            await fetch("/api/recipes_data/get_recipes");

        if (!res.ok) {
            throw new Error(`HTTP Error: ${res.status}`);
        }

        const data = await res.json();

        renderTree(data);

    } catch (err) {

        console.error(
            "Recipe loading failed:",
            err
        );

    }
}

/* =====================================================
   UNIVERSAL SORTING LOGIC (ASC + DESC)
===================================================== */
let recipeSortState = {};

function enableRecipeSorting(table) {

    const head = table.querySelector("thead");

    const body = table.querySelector("tbody");

    if (!head || !body) return;

    const headers =
        head.querySelectorAll("th");

    headers.forEach((th, colIndex) => {

        th.style.cursor = "pointer";

        th.addEventListener("click", () => {

            sortRecipeTable(
                body,
                colIndex
            );

        });

    });

}


function sortRecipeTable(body, colIndex) {

    let rows =
        Array.from(
            body.querySelectorAll("tr")
        );

    recipeSortState[colIndex] =
        recipeSortState[colIndex] === "asc"
            ? "desc"
            : "asc";


    rows.sort((a, b) => {

        let aVal =
            a.children[colIndex]
                ?.innerText
                .trim() || "";

        let bVal =
            b.children[colIndex]
                ?.innerText
                .trim() || "";


        // Auto numeric detection
        const isNumeric =
            !isNaN(parseFloat(aVal)) &&
            !isNaN(parseFloat(bVal));


        if (isNumeric) {

            aVal =
                parseFloat(aVal) || 0;

            bVal =
                parseFloat(bVal) || 0;

        }


        if (
            recipeSortState[colIndex] ===
            "asc"
        ) {

            return aVal > bVal
                ? 1
                : -1;

        } else {

            return aVal < bVal
                ? 1
                : -1;

        }

    });


    // Re-render sorted rows
    body.innerHTML = "";

    rows.forEach(row => {

        body.appendChild(row);

    });

}


/* ---------------- RENDER RECIPE TREE ---------------- */
function renderTree(data) {

    childList.innerHTML = "";

    if (!data.length) {

        childList.innerHTML =
            `<li class="no-data">
                No recipes found
             </li>`;

        return;
    }


    data.forEach(r => {

        const li =
            document.createElement("li");

        li.className =
            "file-node";

        li.dataset.id =
            r.id;

        li.dataset.name =
            r.name;


        li.innerHTML =
            `<i class='bx bx-file'></i>
             <span>${r.name}</span>`;


        li.addEventListener(
            "click",
            () => selectRecipe(r)
        );


        li.addEventListener(
            "dblclick",
            () => renameRecipe(r)
        );


        childList.appendChild(li);

    });

}


/* ---------------- SELECT RECIPE ---------------- */
async function selectRecipe(recipe) {

    document
        .querySelectorAll(".file-node")
        .forEach(x =>
            x.classList.remove("active")
        );


    const node =
        document.querySelector(
            `.file-node[data-id='${recipe.id}']`
        );


    if (node) {

        node.classList.add("active");

    }


    selectedLabel.textContent =
        recipe.name;


    const res =
        await fetch(
            `/api/recipes/${encodeURIComponent(recipe.name)}/table`
        );


    const rows =
        await res.json();


    if (!rows.length) {

        tableContainer.innerHTML =
            `<p class="placeholder">
                No data found for
                <b>${recipe.name}</b>.
             </p>`;

        return;

    }


    tableContainer.innerHTML = "";


    tableContainer.appendChild(
        buildTable(
            recipe.name,
            rows
        )
    );

}


/* ---------------- BUILD TABLE ---------------- */
function buildTable(category, rows) {

    const wrapper = document.createElement("div");
    const table = document.createElement("table");
    table.className = "data-table";

    table.innerHTML = `
        <thead>
            <tr>
                <th style="display:none;">Index</th>
                <th>Silo No</th>
                <th>Material Name</th>
                <th>Set Weight(Kg)</th>
                <th>Fine Weight(Kg)</th>

                <th>
                    Tolerance(kg)
                </th>

                <th class="col-cspeed">
                    Coarse Speed(%)
                </th>

                <th class="col-fspeed">
                    Fine Speed(%)
                </th>

                <th>
                    Action
                </th>

            </tr>

        </thead>


        <tbody id="recipeTableBody">

            ${rows.map(r => `

                <tr
                    data-index="${r.Index}"
                    data-category="${category}"
                >

                    <td style="display:none;">
                        ${r.Index}
                    </td>

                    <td>
                        ${r.SiloNo}
                    </td>

                    <td>
                        ${r.MaterialName}
                    </td>

                    <td>
                        ${r.SetWeight}
                    </td>

                    <td>
                        ${r.FineWeight}
                    </td>

                    <td>
                        ${r.Tolerance}
                    </td>

                    <td class="col-cspeed">
                        ${r.CoarseSpeed}
                    </td>

                    <td class="col-fspeed">
                        ${r.FineSpeed}
                    </td>

                    <td class="action-cell">

                        <button
                            class="table-action-btn edit-btn"
                            {% if not user_logged_in or role == 'operator' %}
                                disabled
                                title="Access Denied"
                            {% endif %}
                        >
                            <i class="bx bx-edit"></i>
                        </button>


                        <button
                            class="table-action-btn delete-btn"
                            {% if not user_logged_in or role == 'operator' %}
                                disabled
                                title="Access Denied"
                            {% endif %}
                        >
                            <i class="bx bx-trash"></i>
                        </button>

                    </td>

                </tr>

            `).join("")}

        </tbody>

    `;


    wrapper.appendChild(table);


    /* =====================================================
       ENABLE SORTING
    ===================================================== */

    setTimeout(() => {

        enableRecipeSorting(table);

    }, 10);


    /* =====================================================
       APPLY SAVED COLUMN VISIBILITY
    ===================================================== */

    applyColumnVisibility(table);


    return wrapper;

}

  /* ---------------- ADD ROW ---------------- */
  document.getElementById("addRowRecipe").addEventListener("click", () => {

    const category = selectedLabel.textContent.trim();
    if (category === "--") return alert("Select a recipe first.");

    const tbody = document.getElementById("recipeTableBody");
    if (!tbody) return;

    const tr = document.createElement("tr");
    tr.className = "new-row";

    tr.innerHTML = `
      <td><input class="edit-input silo"></td>
      <td><input class="edit-input material" disabled></td>
      <td><input class="edit-input set"></td>
      <td><input class="edit-input fine"></td>
      <td><input class="edit-input tol"></td>
      <td class="col-cspeed"><input class="edit-input cspeed"></td>
      <td class="col-fspeed"><input class="edit-input fspeed"></td>
      <td class="action-cell">
        <button class="table-action-btn save-new"><i class="bx bx-check"></i></button>
        <button class="table-action-btn cancel-new"><i class="bx bx-x"></i></button>
      </td>
    `;

    tbody.prepend(tr);

    // Keep the new row's Coarse/Fine Speed cells in sync with the setting
    if (!shouldShowCSpeedFSpeed()) {
      tr.querySelectorAll(".col-cspeed, .col-fspeed").forEach(el => el.style.display = "none");
    }

    const silo = tr.querySelector(".silo");
    const material = tr.querySelector(".material");

    silo.addEventListener("blur", async () => {
      if (!silo.value) return material.value = "";
      const d = await (await fetch(`/api/material/${silo.value}`)).json();
      material.value = d.success ? d.MaterialName : "";
    });

    tr.querySelector(".cancel-new").onclick = () => tr.remove();

    tr.querySelector(".save-new").onclick = async () => {

      if (!silo.value.trim()) return alert("Silo required.");

      const set = Number(tr.querySelector(".set").value);
      const fine = Number(tr.querySelector(".fine").value);
      const tol = Number(tr.querySelector(".tol").value);
      // New Cols
      const cspeed = Number(tr.querySelector(".cspeed").value);
      const fspeed = Number(tr.querySelector(".fspeed").value);
      // ✅ Validation for FineWeight & Tolerance
      if (fine > set) return alert("❌ Fine Weight must be ≤ Set Weight!");
      if (tol > set) return alert("❌ Tolerance must be ≤ Set Weight!");

      const matRes = await fetch(`/api/material/${silo.value}`);
      const matJson = await matRes.json();

      if (!matJson.success) return alert("❌ Invalid Silo Number.");

      const payload = {
        SiloNo: silo.value.trim(),
        SetWeight: set,
        FineWeight: fine,
        Tolerance: tol,
        Category: category,
        // New Cols
        CoarseSpeed: cspeed,
        FineSpeed: fspeed
      };

      const res = await fetch("/api/recipes_data/add_row", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const result = await res.json();

      if (!result.success) {
        if (result.error === "silo_already_exists")
          return alert("❌ This SiloNo already exists in this recipe!");

        if (result.error === "silo_not_found")
          return alert("❌ SiloNo not found in MaterialData!");

        return alert("❌ Add failed: " + result.error);
      }

      selectRecipe({ id: 0, name: category });
    };


  }); // ✅ FIXED CLOSING BRACE

/* ---------------- EDIT ROW ---------------- */
document.addEventListener("click", async (e) => {

    /* ---------------- EDIT ROW ---------------- */
    if (e.target.closest(".edit-btn")) {

        const row = e.target.closest("tr");

        if (row.classList.contains("editing")) return;

        row.classList.add("editing");

        const tds = row.querySelectorAll("td");

        const silo = tds[1].innerText.trim();
        const mat = tds[2].innerText.trim();

        tds[1].innerHTML =
            `<input class="edit-input edit-silo" value="${silo}">`;

        tds[2].innerHTML =
            `<input class="edit-input edit-material" value="${mat}" disabled>`;

        tds[3].innerHTML =
            `<input class="edit-input edit-set" value="${tds[3].innerText}">`;

        tds[4].innerHTML =
            `<input class="edit-input edit-fine" value="${tds[4].innerText}">`;

        tds[5].innerHTML =
            `<input class="edit-input edit-tol" value="${tds[5].innerText}">`;

        /*
         * Coarse Speed and Fine Speed
         *
         * These columns may be hidden by Settings,
         * but the table cells still exist in the DOM.
         */
        tds[6].innerHTML =
            `<input class="edit-input edit-cspeed" value="${tds[6].innerText}">`;

        tds[7].innerHTML =
            `<input class="edit-input edit-fspeed" value="${tds[7].innerText}">`;

        tds[8].innerHTML = `
            <button class="table-action-btn save-edit">
                <i class="bx bx-check"></i>
            </button>

            <button class="table-action-btn cancel-edit">
                <i class="bx bx-x"></i>
            </button>
        `;


        /* ---------------- MATERIAL UPDATE ---------------- */

        const siloInput =
            tds[1].querySelector(".edit-silo");

        const matInput =
            tds[2].querySelector(".edit-material");


        siloInput.addEventListener("blur", async () => {

            if (!siloInput.value) {
                matInput.value = "";
                return;
            }

            const d =
                await (
                    await fetch(
                        `/api/material/${siloInput.value}`
                    )
                ).json();

            matInput.value =
                d.success
                    ? d.MaterialName
                    : "";

        });


        /* ---------------- CANCEL EDIT ---------------- */

        tds[8]
            .querySelector(".cancel-edit")
            .onclick = () => {

                selectRecipe({
                    id: row.dataset.index,
                    name: row.dataset.category
                });

            };


        /* ---------------- SAVE EDIT ---------------- */

        tds[8]
            .querySelector(".save-edit")
            .onclick = async () => {

                const set =
                    Number(
                        tds[3]
                            .querySelector(".edit-set")
                            .value
                    );

                const fine =
                    Number(
                        tds[4]
                            .querySelector(".edit-fine")
                            .value
                    );

                const tol =
                    Number(
                        tds[5]
                            .querySelector(".edit-tol")
                            .value
                    );

                const cspeed =
                    Number(
                        tds[6]
                            .querySelector(".edit-cspeed")
                            .value
                    );

                const fspeed =
                    Number(
                        tds[7]
                            .querySelector(".edit-fspeed")
                            .value
                    );


                /* ---------------- VALIDATION ---------------- */

                if (fine > set) {

                    return alert(
                        "❌ Fine Weight must be ≤ Set Weight!"
                    );

                }

                if (tol > set) {

                    return alert(
                        "❌ Tolerance must be ≤ Set Weight!"
                    );

                }


                const siloInput =
                    tds[1]
                        .querySelector(".edit-silo");


                /* ---------------- CHECK SILO ---------------- */

                const matRes =
                    await fetch(
                        `/api/material/${siloInput.value}`
                    );

                const matJson =
                    await matRes.json();


                if (!matJson.success) {

                    return alert(
                        "❌ Invalid Silo Number!"
                    );

                }


                /* ---------------- UPDATE PAYLOAD ---------------- */

                const payload = {

                    SiloNo:
                        siloInput.value.trim(),

                    Category:
                        row.dataset.category,

                    SetWeight:
                        set,

                    FineWeight:
                        fine,

                    Tolerance:
                        tol,

                    CoarseSpeed:
                        cspeed,

                    FineSpeed:
                        fspeed

                };


                /* ---------------- UPDATE DATABASE ---------------- */

                const res =
                    await fetch(
                        `/api/recipes_data/update_row/${row.dataset.index}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(payload)
                        }
                    );


                const json =
                    await res.json();


                /* ---------------- UPDATE RESULT ---------------- */

                if (!json.success) {

                    if (
                        json.error ===
                        "silo_already_exists"
                    ) {

                        return alert(
                            "❌ This SiloNo already exists in this recipe!"
                        );

                    }


                    if (
                        json.error ===
                        "silo_not_found"
                    ) {

                        return alert(
                            "❌ Silo not found in MaterialData!"
                        );

                    }


                    return alert(
                        "❌ Update error: " +
                        json.error
                    );

                }


                /* ---------------- REFRESH TABLE ---------------- */

                selectRecipe({

                    id:
                        row.dataset.index,

                    name:
                        row.dataset.category

                });

            };

    }


    /* ---------------- DELETE ROW ---------------- */

    if (e.target.closest(".delete-btn")) {

        const row =
            e.target.closest("tr");


        if (!confirm("Delete this row?")) {
            return;
        }


        const res =
            await fetch(
                `/api/recipes_data/delete_row/${row.dataset.index}`,
                {
                    method: "DELETE"
                }
            );


        const json =
            await res.json();


        if (json.success) {

            row.remove();

        } else {

            alert(
                "❌ Delete failed."
            );

        }

    }

});


/* ---------------- RENAME RECIPE ---------------- */

async function renameRecipe(recipe) {

    const newName =
        prompt(
            "Rename recipe:",
            recipe.name
        );


    if (
        !newName ||
        newName.trim() === recipe.name
    ) {
        return;
    }


    const res =
        await fetch(
            "/api/recipes_data/rename_recipe",
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        old_name:
                            recipe.name,

                        new_name:
                            newName.trim()
                    })
            }
        );


    const result =
        await res.json();


    if (result.success) {

        await loadRecipes();


        setTimeout(
            () => {

                selectRecipe({

                    id:
                        recipe.id,

                    name:
                        newName.trim()

                });

            },
            150
        );

    }

}


/* ---------------- ADD RECIPE ---------------- */

async function addRecipe() {

    const name =
        prompt(
            "Enter new recipe name:"
        );


    if (!name) {
        return;
    }


    await fetch(
        "/api/recipes_data/add_recipe",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify({
                    name
                })
        }
    );


    loadRecipes();

}


/* ---------------- IMPORT RECIPE ---------------- */

importBtn.addEventListener(
    "click",
    () => {

        const input =
            document.createElement("input");

        input.type =
            "file";

        input.accept =
            ".xlsx";


        input.onchange = () => {

            const file =
                input.files[0];


            if (!file) {
                return;
            }


            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            fetch(
                "/api/recipes/import",
                {
                    method: "POST",

                    body:
                        formData
                }
            )

            .then(
                res =>
                    res.json()
            )

            .then(
                json => {

                    if (json.success) {

                        alert(
                            "✅ Imported successfully!"
                        );


                        loadRecipes();

                    } else {

                        alert(
                            "❌ Import failed: " +
                            json.error
                        );

                    }

                }
            )

            .catch(
                err => {

                    alert(
                        "❌ Error: " +
                        err
                    );

                }
            );

        };


        input.click();

    }
);


/* ---------------- EXPORT RECIPE ---------------- */

exportBtn.addEventListener(
    "click",
    async () => {

        const category =
            document
                .getElementById(
                    "selectedRecipeLabel"
                )
                .textContent
                .trim();


        if (category === "--") {

            return alert(
                "Please select a recipe to export."
            );

        }


        const res =
            await fetch(
                "/api/recipes/export",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            category
                        })
                }
            );


        if (!res.ok) {

            const error =
                await res.json();


            return alert(
                error.error ||
                "Export failed"
            );

        }


        /* ---------------- DOWNLOAD EXCEL ---------------- */

        const blob =
            await res.blob();


        const url =
            window.URL.createObjectURL(
                blob
            );


        const a =
            document.createElement("a");


        a.href =
            url;


        a.download =
            `${category}.xlsx`;


        a.click();


        window.URL.revokeObjectURL(
            url
        );

    }
);


/* ---------------- DELETE RECIPE ---------------- */

async function deleteSelectedRecipe() {

    const active =
        document.querySelector(
            ".file-node.active"
        );


    if (!active) {

        return alert(
            "Select a recipe first."
        );

    }


    const name =
        active.dataset.name;


    if (
        !confirm(
            `Delete "${name}"?`
        )
    ) {

        return;

    }


    await fetch(
        `/api/recipes_data/delete_recipe/${encodeURIComponent(name)}`,
        {
            method: "DELETE"
        }
    );


    loadRecipes();


    selectedLabel.textContent =
        "--";


    tableContainer.innerHTML =
        `<p class="placeholder">
            Recipe deleted.
         </p>`;

}


/* ---------------- SEARCH RECIPE ---------------- */

searchInput.addEventListener(
    "input",
    () => {

        const q =
            searchInput.value
                .toLowerCase();


        document
            .querySelectorAll(
                ".file-node"
            )
            .forEach(n => {

                n.style.display =
                    n.dataset.name
                        .toLowerCase()
                        .includes(q)
                        ? ""
                        : "none";

            });

    }
);


/* ---------------- RECIPE BUTTON EVENTS ---------------- */

addRecipeIcon.addEventListener(
    "click",
    addRecipe
);


deleteRecipeBtn.addEventListener(
    "click",
    deleteSelectedRecipe
);


/* =====================================================
   IMPORTANT:
   LOAD COLUMN SETTINGS FIRST
   THEN LOAD RECIPES
===================================================== */

loadColumnSetting()
    .then(() => {

        console.log(
            "Column settings loaded successfully."
        );

        loadRecipes();

    })
    .catch(err => {

        console.error(
            "Failed to load column settings:",
            err
        );

        /*
         * Even if column settings fail,
         * recipes should still load.
         */
        loadRecipes();

    });

});


/* =====================================================
   DOWNLOAD RECIPE
===================================================== */
const recipedownload =
    document.getElementById(
        "recipedownload"
    );


recipedownload.addEventListener(
    "click",
    async () => {

        try {

            const mixerno =
                document.getElementById(
                    "mixerNo"
                ).value;


            const recipe_name =
                document.getElementById(
                    "selectedRecipeLabel"
                )
                .textContent
                .trim();


            if (
                recipe_name === "--" ||
                !recipe_name
            ) {

                alert(
                    "Please select a recipe."
                );

                return;

            }


            const response =
                await fetch(
                    "/download_recipe",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                mixerno,

                                recipe_name

                            })

                    }
                );


            const data =
                await response.json();


            /* ---------------- CHECK SUCCESS ---------------- */

            if (!data.success) {

                throw new Error(
                    data.message ||
                    "Recipe download failed"
                );

            }


            alert(
                data.message
            );


        } catch (error) {

            console.error(
                "Error:",
                error
            );


            alert(
                error.message
            );

        }

    }
);


</script>
